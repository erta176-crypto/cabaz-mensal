name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - name: Análise
        run: flutter analyze

      # O teste de integração com o seed real faz skip no CI (não há seed nem Docker).
      - name: Testes
        run: flutter test

      - name: Configuração a partir dos secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p env
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' > env/ci.json

      # A mesma chave do build local, para o adb install -r funcionar por cima (decisão 0014).
      - name: Chave de release a partir dos secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          jks="$RUNNER_TEMP/cabaz-mensal.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$jks"
          # Falha já se o secret não for o base64 exato do keystore (só hash e tamanho; nada secreto).
          echo "Keystore: $(stat -c%s "$jks") bytes (esperado 2618), início $(head -c 4 "$jks" | od -An -tx1)"
          echo "0bad7e0e2b735850995ef6ec4408eb98a107114a63f5aef8074a256527ba4dba  $jks" | sha256sum -c -
          {
            echo "storeFile=$RUNNER_TEMP/cabaz-mensal.jks"
            echo "storePassword=$RELEASE_KEYSTORE_PASSWORD"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=$RELEASE_KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=env/ci.json

      - name: Confirmar a chave do APK
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk             | grep "SHA-256 digest: e2bfab75bf8cf399b0e25f0df50de2e9281514bf2b6c95bc83469463b1de8f47"

      - uses: actions/upload-artifact@v4
        with:
          name: cabaz-mensal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
