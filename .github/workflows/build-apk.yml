name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Análise
        run: flutter analyze

      # O teste de integração com o seed real faz skip no CI (não há seed nem Docker).
      - name: Testes
        run: flutter test

      - name: Configuração a partir dos secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p env
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' > env/ci.json

      # Assinatura de debug nesta fase (ver README para criar uma keystore própria).
      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=env/ci.json

      - uses: actions/upload-artifact@v4
        with:
          name: cabaz-mensal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
